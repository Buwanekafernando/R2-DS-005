<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1030" />
    <title>NeuroMark AI</title>
    <script>
      // Set the saved/device theme before first paint so the page never flashes the wrong colours.
      (function () {
        var t = "light";
        try {
          var s = localStorage.getItem("nm_theme");
          if (s === "light" || s === "dark") t = s;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
